name: Secret presence check

# Temporary: answers whether the host, user and host key live at repository level
# or per environment. Prints only whether a name is set, never a value.

on:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Which names are visible without an environment
              env:
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_USER: ${{ secrets.SSH_USER }}
                  SSH_PORT: ${{ secrets.SSH_PORT }}
                  SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
                  SSH_KEY: ${{ secrets.SSH_KEY }}
              run: |
                  for name in SSH_HOST SSH_USER SSH_PORT SSH_KNOWN_HOSTS SSH_KEY; do
                      value="${!name}"
                      if [ -n "$value" ]; then
                          echo "$name: set (${#value} chars)"
                      else
                          echo "$name: EMPTY"
                      fi
                  done
