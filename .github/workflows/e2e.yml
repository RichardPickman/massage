name: e2e

# The browser suite needs both repositories: the frontend under test and the API it
# talks to. The API is the test entry (`massage-backend/e2e/server.ts`), which runs
# the real router on an in-memory MongoDB — no secrets, no shared database, nothing
# deployed.
on:
    pull_request:
    push:
        branches: [master, testing]

concurrency:
    group: e2e-${{ github.ref }}
    cancel-in-progress: true

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
              with:
                  path: massage

            # The integration branch, not `master`: the API the app is developed against is
            # the one on `testing`, and a run against production's schema would test a
            # contract the client no longer speaks. While a paired backend branch of the
            # same name exists it is used instead, so a two-repository change can be run
            # together before either side is merged.
            - name: Check out the API (paired branch)
              id: api-paired
              uses: actions/checkout@v4
              continue-on-error: true
              with:
                  repository: ${{ github.repository_owner }}/massage-backend
                  ref: ${{ github.head_ref || 'testing' }}
                  path: massage-backend
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Fall back to the integration branch
              if: steps.api-paired.outcome == 'failure'
              uses: actions/checkout@v4
              with:
                  repository: ${{ github.repository_owner }}/massage-backend
                  ref: testing
                  path: massage-backend
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: pnpm/action-setup@v4
              with:
                  # Both manifests live in subdirectories, so the action cannot read the
                  # version from a package.json in the workspace root.
                  version: 12.3.4
            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: pnpm
                  cache-dependency-path: |
                      massage/pnpm-lock.yaml
                      massage-backend/pnpm-lock.yaml

            - name: Install the API
              working-directory: massage-backend
              run: pnpm install --frozen-lockfile

            - name: Install the app
              working-directory: massage
              run: pnpm install --frozen-lockfile

            # Chromium only: the suite runs a desktop and a phone viewport, not WebKit or
            # Firefox. `--with-deps` installs the system libraries the browser needs.
            - name: Install the browser
              working-directory: massage
              run: pnpm exec playwright install --with-deps chromium

            - name: Run the suite
              working-directory: massage
              run: pnpm test:e2e

            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: massage/playwright-report/
                  retention-days: 7
